  - CodeMirror
  - ConfirmEdit
  - ConfirmEdit/hCaptcha
  - DarkMode
  - DelayedJobQueue
  - Description2
  - DisableAccount
  - Disambiguator
  - DiscordRCFeed
  - DiscussionTools
  - DismissableSiteNotice
  - Echo
  - EmbedVideo
  - FacetedCategory
  - FediFeeds
  - FlaggedRevs
  - Flow
  - Gadgets
  - GoogleNewsSitemap
  - GoogleSiteSearch
  - CommunityConfiguration
  - GrowthExperiments
  - GuidedTour
  - InputBox
  - JsonConfig
  - Josa
  - Kartographer
  - Linter
  - LoginNotify
  - Math
  - MobileFrontend
  - Newsletter
  - Nuke
