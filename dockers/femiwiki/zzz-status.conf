[www]
; Read by Alloy through Caddy's metrics site; see the Caddyfile. Only a
; SCRIPT_NAME of exactly this reaches it, which the public site never sends.
pm.status_path = /fpm-status
; Served by a hidden pool of its own, so the page still answers while every
; www worker is busy, which is when it matters. run derives the port.
pm.status_listen = 127.0.0.1:${PHP_FPM_STATUS_LISTEN}
