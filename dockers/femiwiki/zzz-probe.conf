[probe]
listen = ${PHP_FPM_PROBE_LISTEN}
user = www-data
group = www-data
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
; The official image sets this under [www] alone, so a pool of our own gets
; php-fpm's default of yes and its workers see none of what run exported.
; databasez.php needs WG_DB_PASSWORD, which run exports after it starts.
clear_env = no
