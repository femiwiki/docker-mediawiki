version: 2
updates:
  - package-ecosystem: 'docker'
    directory: '/'
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: 'composer'
    directory: '/'
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    directory: '/'
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    ignore:
      # Follows the Node github-script runs; the etc-lint job fails the PR that moves it
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    cooldown:
      default-days: 7

  - package-ecosystem: 'docker'
    directory: '/dockers/femiwiki-extensions'
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: 'docker'
    directory: '/dockers/php-fpm'
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    ignore:
      # A new PHP minor needs MediaWiki's support for it checked first
      - dependency-name: 'php'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
    cooldown:
      default-days: 7

  - package-ecosystem: 'docker'
    directory: '/dockers/caddy'
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: 'composer'
    directory: '/dockers/femiwiki-extensions/extension-installer'
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    groups:
      github-actions:
        patterns:
          - '*'
        exclude-patterns:
          - 'femiwiki/.github/.github/workflows/*'
    cooldown:
      default-days: 7
