name: Submit a PR for bumping the PHP minor version

# Dependabot only bumps PHP patches; a newer minor waits until mediawiki.org
# lists it as supported by the MediaWiki version we run
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  bump-php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - run: npm ci

      - name: Find the highest PHP minor MediaWiki supports
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BODY: ${{ runner.temp }}/body.md
        with:
          script: |
            const fs = require('fs');
            const semver = require('semver');
            const mediawiki = fs
              .readFileSync('dockers/mediawiki/Dockerfile', 'utf8')
              .match(/^ARG MEDIAWIKI_VERSION=1\.(\d+)\./m)[1];
            const dockerfile = 'dockers/php-fpm/Dockerfile';
            const text = fs.readFileSync(dockerfile, 'utf8');
            const [, cur, variant] = text.match(/^FROM .*php:(\d+\.\d+\.\d+)-(\S+)$/m);

            const get = async (url) => {
              const res = await fetch(url);
              if (!res.ok) throw new Error(`${url}: ${res.status}`);
              return res;
            };

            // Rows look like "|  3 text = 8.3.0+ |  3 start = 39 |  3 end = 46"
            const template = 'https://www.mediawiki.org/wiki/Template:Compatibility_PHP';
            const wikitext = await (await get(`${template}?action=raw`)).text();
            const supported = [...wikitext.matchAll(/\|\s*(\d+) text = (\d+\.\d+)\.\S*\s*\|\s*\1 start = *(\d+)(?:\s*\|\s*\1 end = *(\d+))?/g)]
              .filter(([, , , start, end]) => +start <= +mediawiki && (end === undefined || +mediawiki <= +end))
              .map(([, , minor]) => `${minor}.0`);
            const minor = semver.rsort(supported)[0];
            if (!minor || semver.lte(minor, cur.replace(/\.\d+$/, '.0'))) {
              core.info(`MediaWiki 1.${mediawiki} supports up to PHP ${minor?.replace(/\.0$/, '')}; we run ${cur}`);
              return;
            }

            const prefix = minor.replace(/\.0$/, '');
            const tags = await (await get(`https://hub.docker.com/v2/repositories/library/php/tags?name=${prefix}.&page_size=100`)).json();
            const versions = tags.results
              .map((t) => t.name.match(new RegExp(`^(${prefix.replace('.', '\\.')}\\.\\d+)-${variant}$`))?.[1])
              .filter(Boolean);
            if (versions.length === 0) {
              core.warning(`No php:${prefix}.x-${variant} image yet`);
              return;
            }
            const latest = semver.rsort(versions)[0];

            fs.writeFileSync(dockerfile, text.replace(`php:${cur}-${variant}`, `php:${latest}-${variant}`));
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `[MediaWiki 1.${mediawiki} supports PHP ${prefix}](${template}), so this bumps PHP ${cur} → ${latest}.`,
              '',
              `Opened by [run ${context.runId}](${run}).`,
            ].join('\n');
            fs.writeFileSync(process.env.BODY, body + '\n');
            core.info(body);
            core.setOutput('ver', latest);
            core.setOutput('minor', prefix);
            core.setOutput('mediawiki', `1.${mediawiki}`);

      - name: Update README
        if: steps.check.outputs.ver != ''
        uses: ./.github/actions/add-changelog-entry
        with:
          image: php-fpm
          level: minor
          message: Bump php to ${{ steps.check.outputs.ver }}, which MediaWiki ${{ steps.check.outputs.mediawiki }} supports

      # A new entry rebuilds the extensions, whose Dockerfile reads the new PHP
      - name: Update the extensions README
        if: steps.check.outputs.ver != ''
        uses: ./.github/actions/add-changelog-entry
        with:
          image: femiwiki-extensions
          message: Resolve composer dependencies for PHP ${{ steps.check.outputs.minor }}

      - uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668 # v5.1.1
        if: ${{ steps.check.outputs.ver != '' && github.repository_owner == 'femiwiki' && github.ref == 'refs/heads/main' }}
        id: get_workflow_token
        with:
          application_id: ${{ vars.PAT_APPLICATION_ID }}
          application_private_key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}

      - name: Create Pull Request
        if: steps.check.outputs.ver != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.get_workflow_token.outputs.token }}
          commit-message: 'build(php-fpm): bump PHP to ${{ steps.check.outputs.ver }}'
          title: 'build(php-fpm): bump PHP to ${{ steps.check.outputs.ver }}'
          branch: bump-php
          body-path: ${{ runner.temp }}/body.md
