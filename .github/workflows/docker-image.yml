name: 'Docker: image'

# Builds one image; main publishes it as <time>-<commit> and opens the pull
# request pinning it downstream, a mw-* branch only publishes. Via images.yml.
on:
  workflow_call:
    inputs:
      image:
        description: The directory under dockers/, also the ghcr.io/femiwiki name
        required: true
        type: string
      downstream:
        description: The image under dockers/ whose Dockerfile is bumped to the new tag
        required: true
        type: string
      arches:
        description: The architectures to build, as a JSON array
        required: false
        type: string
        default: '["amd64", "arm64"]'
      automerge:
        description: Merge the downstream bump pull request once its checks pass
        required: false
        type: boolean
        default: false
      build-contexts:
        description: Named build contexts the Dockerfile reads, as name=path lines
        required: false
        type: string
        default: ''
    secrets:
      PAT_APPLICATION_PRIVATE_KEY:
        description: Opens the downstream bump pull request; only used from main
        required: false

concurrency:
  group: docker-${{ inputs.image }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: github.repository_owner == 'femiwiki' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/mw-'))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: '{{ defaultContext }}:dockers/${{ inputs.image }}'
          platforms: linux/${{ matrix.arch }}
          build-contexts: ${{ inputs.build-contexts }}
          cache-from: type=gha,scope=${{ inputs.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ matrix.arch }}
          outputs: ${{ (github.repository_owner == 'femiwiki' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/mw-'))) && format('type=image,name=ghcr.io/femiwiki/{0},push-by-digest=true,name-canonical=true,push=true', inputs.image) || 'type=cacheonly' }}
      - name: Export digest
        if: github.repository_owner == 'femiwiki' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/mw-'))
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: github.repository_owner == 'femiwiki' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/mw-'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ inputs.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push-manifest:
    needs: [build]
    if: github.repository_owner == 'femiwiki' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/mw-'))
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A mw-* branch builds the next MediaWiki release, e.g. mw-1.46 publishes
      # 1.46-<time>-<sha>, and nothing on main is bumped to it
      - id: tag
        run: |
          prefix=''
          [ "$GITHUB_REF_NAME" = main ] || prefix="${GITHUB_REF_NAME#mw-}-"
          echo "tag=${prefix}$(date +%Y-%m-%dT%H-%M)-$(echo "$GITHUB_SHA" | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.image }}-*
          merge-multiple: true
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No latest: only the femiwiki image's is pulled, by compose.yaml
      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          image="ghcr.io/femiwiki/${IMAGE}"
          args=(-t "${image}:${TAG}")
          for digest in *; do
            args+=("${image}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

  bump-downstream:
    needs: [push-manifest]
    if: github.repository_owner == 'femiwiki' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Main as it is now, not the commit this run built: create-pull-request
      # cuts the branch from what is checked out, and a bump merged since then
      # edits the same lines, as #1310 did to #1311
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          # The pull request body lists the commits since the one downstream pins
          fetch-depth: 0
      - uses: ./.github/actions/bump-pin
        id: pin
        with:
          tag: ${{ needs.push-manifest.outputs.tag }}
          upstream: ${{ inputs.image }}
          downstream: ${{ inputs.downstream }}
      - uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668 # v5.1.1
        if: steps.pin.outputs.behind == 'true'
        id: get_workflow_token
        with:
          application_id: ${{ vars.PAT_APPLICATION_ID }}
          application_private_key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}
      # One branch per image pair, so a newer build force-updates the open
      # bump pull request instead of opening a second one beside it
      - name: Create Pull Request
        if: steps.pin.outputs.behind == 'true'
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.get_workflow_token.outputs.token }}
          commit-message: 'build(${{ inputs.downstream }}): bump ${{ inputs.image }} image to ${{ needs.push-manifest.outputs.tag }}'
          title: 'build(${{ inputs.downstream }}): bump ${{ inputs.image }} image to ${{ needs.push-manifest.outputs.tag }}'
          branch: bump-${{ inputs.image }}-${{ inputs.downstream }}
          body-path: ${{ runner.temp }}/body.md
      # A conflicting pull request reports no failing check of its own, so it
      # fails here, e.g. when the open one merged while this run was pushing
      - name: Check the pull request merges
        if: steps.create-pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: |
          # GitHub answers UNKNOWN until it has tried the merge
          for _ in $(seq 24); do
            state="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeable --jq .mergeable)"
            [ "$state" = UNKNOWN ] || break
            sleep 5
          done
          if [ "$state" != MERGEABLE ]; then
            echo "::error::#${PR_NUMBER} is ${state} against main; re-run this job to rebuild it from main"
            exit 1
          fi
      - name: Enable Pull Request Automerge
        if: inputs.automerge && steps.create-pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: gh pr merge --squash --auto "$PR_NUMBER"
