name: 'Docker: femiwiki'

# Called by images.yml, for pull requests (through required.yml), pushes to main or a mw-* branch and by hand
on:
  workflow_call:
    secrets:
      PAT_APPLICATION_PRIVATE_KEY:
        description: Opens the downstream bump pull request; only used from main
        required: false

concurrency:
  group: docker-femiwiki-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    # Already passed on the pull request; a squash merge ships the same tree
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Edit configuration
        run: |
          mv dockers/femiwiki/LocalSettings.php development
          mv dockers/femiwiki/Hotfix.php development
          sed -i -r 's~ghcr\.io\/femiwiki\/femiwiki:.+~ghcr\.io\/femiwiki\/femiwiki:docker-test~' compose.yaml
      - name: Build amd64 image for testing
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: '{{ defaultContext }}:dockers/femiwiki'
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/femiwiki/femiwiki:buildcache-amd64
          load: true
          push: false
          tags: ghcr.io/femiwiki/femiwiki:docker-test
      - name: Initialize docker swarm and start services
        run: |
          docker swarm init
          docker stack deploy -c compose.yaml -c .github/compose-test.yml mediawiki
      - name: Access 127.0.0.1:8080 until success
        timeout-minutes: 2
        run: |
          echo 'Waiting for http...'
          until curl -sLfo /dev/null 127.0.0.1:8080; do
            sleep 1; done
      - name: Test VisualEditor API
        run: |
          URL="127.0.0.1:8080/api.php?action=visualeditor&format=json&page=arbitrary_page&paction=parse&wikitext=arbitrary"
          curl -sLfo /dev/null "$URL"
      - name: Test Extension:Math
        timeout-minutes: 1
        run: |
          URL="127.0.0.1:8080/w/Special:MathStatus"
          until curl -sLfo /dev/null "$URL"; do
            sleep 1; done
      - name: Check that every setting LocalSettings.php assigns is declared
        run: |
          c="$(docker ps -qf name=mediawiki_fastcgi | head -1)"
          docker cp .github/scripts/CheckConfigKeys.php "$c:/tmp/CheckConfigKeys.php"
          docker cp development/LocalSettings.php "$c:/tmp/LocalSettings.php"
          docker exec "$c" php /tmp/CheckConfigKeys.php /tmp/LocalSettings.php
      # A route file that fails to load breaks every /rest.php request, search
      # suggestions included; the discovery document lists every module, and
      # each module's spec reads that module's routes.
      - name: Test every REST module
        shell: bash
        run: |
          fail=0
          curl -sSf 127.0.0.1:8080/rest.php/specs/v0/discovery -o "$RUNNER_TEMP/discovery.json"
          for url in $(jq -r '.modules[].spec' "$RUNNER_TEMP/discovery.json") \
            '127.0.0.1:8080/rest.php/v1/search/title?q=a&limit=1'; do
            curl -sSfo /dev/null "$url" || { echo "::error::$url"; fail=1; }
          done
          exit "$fail"
      # load.php answers a module that fails to build with 200 and the error in
      # a comment, so ask ResourceLoader itself. Its log lines go to stderr as
      # JSON and are left out.
      - name: Build every ResourceLoader module for the femiwiki skin
        shell: bash
        run: |
          c="$(docker ps -qf name=mediawiki_fastcgi | head -1)"
          docker cp .github/scripts/CheckResourceLoader.php "$c:/tmp/CheckResourceLoader.php"
          docker exec "$c" php /tmp/CheckResourceLoader.php 2>&1 | grep -v -e '^{' -e '^$'
      # A cache hit has to answer as MediaWiki did: femiwiki/caddy-mwcache#165
      # turned every cached redirect into an empty 200, and / into a blank page
      - name: Request redirects and an article twice through the cache
        run: .github/scripts/check-cached-twice.sh
      - name: Fail on any exception the wiki logged
        run: |
          if docker service logs mediawiki_fastcgi 2>&1 | grep -E '"channel":"exception"|PHP Fatal error'; then
            exit 1
          fi
      - name: backup of failure
        if: ${{ failure() }}
        timeout-minutes: 1
        run: |
          URL="127.0.0.1:8080"
          curl -Lv "$URL" && echo "main success" || echo "main failure"
          URL="127.0.0.1:8080/api.php?action=visualeditor&format=json&page=arbitrary_page&paction=parse&wikitext=arbitrary"
          curl -Lv "$URL" && echo "VE success" || echo "VE failure"
          URL="127.0.0.1:8080/w/Special:MathStatus"
          curl -Lv "$URL" && echo "Math success" || echo "Math failure"
      - name: backup of failure - docker status
        if: ${{ failure() }}
        run: |
          docker ps;
          for s in $(docker service ls -q ); do docker service ps "$s"; done
          docker container ps;
      - name: backup of failure - docker logs
        if: ${{ failure() }}
        run: |
          for s in $(docker service ls -q ); do docker service logs "$s"; done
      - name: Check if the container is still up
        run: test "$(docker service ps -qf 'desired-state=Running' -f 'desired-state=Ready' mediawiki_fastcgi)"
      - name: Try to access the mediawiki
        run: curl -sSLvo /dev/null 127.0.0.1:8080 || docker service logs mediawiki_fastcgi

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      CACHE_PREFIX: ${{ startsWith(github.base_ref || github.ref_name, 'mw-') && format('{0}-', github.base_ref || github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to ghcr.io
        if: github.repository_owner == 'femiwiki' && github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: '{{ defaultContext }}:dockers/femiwiki'
          platforms: ${{ matrix.platform }}
          # An Actions cache written on a pull request is invisible to main, so
          # main rebuilds what the pull request just built. A registry cache is
          # outside that scoping. A fork cannot write it: its token is read
          # only whatever this workflow asks for.
          # A mw-* branch keeps a cache of its own, so building the next
          # MediaWiki release does not evict what main builds from.
          cache-from: type=registry,ref=ghcr.io/femiwiki/femiwiki:buildcache-${{ env.CACHE_PREFIX }}${{ matrix.arch }}
          cache-to: |-
            ${{ case(
              github.repository_owner == 'femiwiki' && github.event.pull_request.head.repo.fork != true,
              format('type=registry,ref=ghcr.io/femiwiki/femiwiki:buildcache-{0}{1},mode=max,image-manifest=true,oci-mediatypes=true', env.CACHE_PREFIX, matrix.arch),
              ''
            ) }}
          outputs: ${{ (github.repository_owner == 'femiwiki' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/mw-'))) && 'type=image,name=ghcr.io/femiwiki/femiwiki,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}
      - name: Export digest
        if: github.repository_owner == 'femiwiki' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/mw-'))
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: github.repository_owner == 'femiwiki' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/mw-'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: femiwiki-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push-manifest:
    needs: [build]
    if: github.repository_owner == 'femiwiki' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/mw-'))
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # A mw-* branch builds the next MediaWiki release, e.g. mw-1.46 publishes
      # 1.46-<time>-<sha>, never latest, and nothing bumps infra to it
      - id: version
        run: |
          prefix=''
          [ "$GITHUB_REF_NAME" = main ] || prefix="${GITHUB_REF_NAME#mw-}-"
          echo "version=${prefix}$(date +%Y-%m-%dT%H-%M)-$(echo "$GITHUB_SHA" | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          # digests-femiwiki-* would also take femiwiki-extensions' digests
          pattern: femiwiki-digests-*
          merge-multiple: true
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image=ghcr.io/femiwiki/femiwiki
          args=(-t "${image}:${VERSION}")
          [ "$GITHUB_REF_NAME" = main ] && args+=(-t "${image}:latest")
          for digest in *; do
            args+=("${image}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

  bump-infra:
    needs: [push-manifest]
    # INFRA_BUMP_PAUSED holds the bump while main builds a MediaWiki that is no
    # longer the one serving, as during femiwiki/femiwiki#645.
    if: github.repository_owner == 'femiwiki' && github.ref == 'refs/heads/main' && vars.INFRA_BUMP_PAUSED != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668 # v5.1.1
        id: get_workflow_token
        with:
          application_id: ${{ vars.PAT_APPLICATION_ID }}
          application_private_key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: femiwiki/infra
          token: ${{ steps.get_workflow_token.outputs.token }}
          path: infra
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github/release-notes.sh
            .github/scripts/built-from.mts
          sparse-checkout-cone-mode: false
          path: self
          persist-credentials: false
      - name: Find the roots that run this image
        id: roots
        working-directory: infra
        run: |
          # Read off the tree rather than listed here, so Tokyo's retirement
          # drops a root without anyone remembering to. The step used to name
          # docker/ alone, which left the Seoul root to a hand commit on the
          # bump branch. See femiwiki/infra#905.
          roots=""
          for f in */container.tf; do
            if grep -q 'ghcr\.io/femiwiki/femiwiki:' "$f"; then
              roots="$roots ${f%/container.tf}"
            fi
          done
          roots="${roots# }"
          [ -n "$roots" ] || { echo 'No root runs this image.' >&2; exit 1; }
          echo "Roots: $roots"
          echo "roots=$roots" >> "$GITHUB_OUTPUT"
          echo "first=${roots%% *}" >> "$GITHUB_OUTPUT"
      - name: List the pull requests since the tag infra currently uses
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONTAINER_TF: infra/${{ steps.roots.outputs.first }}/container.tf
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        with:
          script: |
            const { default: builtFrom } = await import(`${process.env.GITHUB_WORKSPACE}/self/.github/scripts/built-from.mts`)
            await builtFrom({ github, core, env: process.env })
      - name: Write the release notes
        if: steps.source.outputs.prs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.source.outputs.prs }}
          REPO: ${{ github.repository }}
        run: |
          # The wiki's release notes, in English until translated there
          # shellcheck disable=SC2086 # one argument per pull request
          self/.github/release-notes.sh "$REPO" $PRS > "${RUNNER_TEMP}/wikitext.md"
      - name: Carry over what is already on the bump branch
        id: carry
        env:
          FIRST_ROOT: ${{ steps.roots.outputs.first }}
          GH_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
          ROOTS: ${{ steps.roots.outputs.roots }}
        run: |
          n="$(gh pr list --repo femiwiki/infra --head bump-femiwiki-image \
                 --state open --json number --jq '.[0].number // empty')"
          if [ -z "$n" ]; then
            echo 'No open bump pull request, so main is the base.'
            exit 0
          fi
          echo "Rebuilding femiwiki/infra#${n} on top of its own contents."
          # Its generation is running only if the apply job on its head passed.
          head="$(gh pr view "$n" --repo femiwiki/infra --json headRefOid --jq .headRefOid)"
          # An apply still running is about to make its number the running one.
          # 80 x 15s covers the docker apply job's 20-minute timeout.
          for _ in $(seq 80); do
            read -r status gate <<< "$(gh api "repos/femiwiki/infra/commits/${head}/check-runs" \
                    -f check_name="${FIRST_ROOT} apply" -X GET \
                    --jq '.check_runs[0] | "\(.status // "none") \(.conclusion // "none")"')"
            case "$status" in completed | none | waiting) break ;; esac
            echo "The apply on #${n} is ${status}, waiting."
            sleep 15
          done
          # Read the running numbers off the branch rather than out of the
          # patch below, so a generation changed on main by any other pull
          # request cannot make this step hand a running number out again.
          if [ "$gate" = success ]; then
            echo "#${n} was applied, so the next generation comes after its own."
            gens=""
            for root in $ROOTS; do
              g="$(gh api "repos/femiwiki/infra/contents/${root}/locals.tf?ref=bump-femiwiki-image" \
                     --jq .content | base64 -d \
                     | grep -oE 'fastcgi_generation = [0-9]+' | grep -oE '[0-9]+$')"
              gens="$gens ${root}:${g}"
            done
            echo "Running generations: ${gens# }"
            echo "gens=${gens# }" >> "$GITHUB_OUTPUT"
          else
            echo "#${n} was not applied, so the next generation comes after main's."
          fi
          gh api -H 'Accept: application/vnd.github.diff' \
            repos/femiwiki/infra/compare/main...bump-femiwiki-image \
            > "${RUNNER_TEMP}/bump-branch.patch"
          # Only hand-written commits matter here now; the image tag is
          # overwritten below and the generations come from the branch itself.
          # A branch that no longer applies onto main is dropped rather than
          # failing the build, which is what left #894 conflicting all morning.
          if [ -s "${RUNNER_TEMP}/bump-branch.patch" ]; then
            if ! git -C infra apply --3way "${RUNNER_TEMP}/bump-branch.patch"; then
              git -C infra checkout -- .
              git -C infra clean -fd
              echo "::warning::femiwiki/infra#${n} does not apply onto main, so it is rebuilt from main and anything hand-written on it is dropped."
            fi
          fi
      - name: Bump the image tag and the fastcgi generation
        working-directory: infra
        env:
          VERSION: ${{ needs.push-manifest.outputs.version }}
          GENS: ${{ steps.carry.outputs.gens }}
          ROOTS: ${{ steps.roots.outputs.roots }}
        run: |
          # Every root, each with its own generation: they diverged while only
          # docker/ was bumped here. See femiwiki/infra#905.
          for root in $ROOTS; do
            sed -i -E "s|(ghcr\.io/femiwiki/femiwiki:)[^\"]+|\1${VERSION}|g" "$root/container.tf"
            # The running generation is main's, unless the open bump pull
            # request was applied: a bump is applied before it merges, so main
            # then still holds the one before the running container, and the
            # carry step read the running number off the branch.
            GEN=""
            for pair in $GENS; do
              if [ "${pair%%:*}" = "$root" ]; then
                GEN="${pair##*:}"
              fi
            done
            if [ -z "$GEN" ]; then
              GEN="$(git show "HEAD:$root/locals.tf" \
                     | grep -oE 'fastcgi_generation = [0-9]+' | grep -oE '[0-9]+$')"
            fi
            sed -i -E "s|(fastcgi_generation = )[0-9]+|\1$((GEN + 1))|" "$root/locals.tf"
          done
          git diff --stat
      - name: Write the pull request body
        env:
          REFS: ${{ steps.source.outputs.refs }}
        run: |
          {
            echo 'Built from:'
            echo
            printf '%s\n' "$REFS"
            if [ -s "${RUNNER_TEMP}/wikitext.md" ]; then
              echo
              cat "${RUNNER_TEMP}/wikitext.md"
            fi
          } > "${RUNNER_TEMP}/body.md"
          cat "${RUNNER_TEMP}/body.md"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.get_workflow_token.outputs.token }}
          path: infra
          commit-message: 'build(docker): bump femiwiki image to ${{ needs.push-manifest.outputs.version }}'
          title: 'build(docker): bump femiwiki image to ${{ needs.push-manifest.outputs.version }}'
          branch: bump-femiwiki-image
          body-path: ${{ runner.temp }}/body.md
