name: Submit PRs for MediaWiki security fixes

# Bug fixes wait for the monthly bumps; only releases and commits marked
# SECURITY open a pull request here
on:
  schedule:
    - cron: '23 0 * * 1' # any minute but :00, where GitHub delays or drops scheduled runs
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mediawiki:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - run: npm ci

      - name: Find a newer point release with security fixes
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BODY: ${{ runner.temp }}/body.md
        with:
          script: |
            const fs = require('fs');
            const semver = require('semver');
            const dockerfile = 'dockers/mediawiki/Dockerfile';
            const text = fs.readFileSync(dockerfile, 'utf8');
            const cur = text.match(/^ARG MEDIAWIKI_VERSION=(\S+)$/m)[1];
            const major = cur.split('.').slice(0, 2).join('.');

            const get = async (url) => {
              const res = await fetch(url);
              if (!res.ok) throw new Error(`${url}: ${res.status}`);
              return res;
            };
            const dir = `https://releases.wikimedia.org/mediawiki/${major}/`;
            const listing = await (await get(dir)).text();
            const versions = [...listing.matchAll(/mediawiki-core-(\d+\.\d+\.\d+)\.tar\.gz"/g)].map((m) => m[1]);
            const latest = semver.rsort(versions)[0];
            if (!semver.gt(latest, cur)) {
              core.info(`${cur} is the latest ${major} release`);
              return;
            }

            // Tags and the branch's notes land after the tarball, so read the notes from it
            const tarball = `${process.env.RUNNER_TEMP}/mediawiki.tar.gz`;
            fs.writeFileSync(tarball, Buffer.from(await (await get(`${dir}mediawiki-core-${latest}.tar.gz`)).arrayBuffer()));
            const { stdout: notes } = await exec.getExecOutput(
              'tar',
              ['-xzOf', tarball, '--wildcards', `*/RELEASE-NOTES-${major}`],
              { silent: true },
            );
            const security = notes
              .split(`\n== MediaWiki ${cur} ==`)[0]
              .replace(/\n  /g, ' ')
              .split('\n')
              .filter((line) => /^\* \(.*\) SECURITY:/.test(line));
            if (security.length === 0) {
              core.info(`${latest} has no security fixes since ${cur}`);
              return;
            }

            fs.writeFileSync(dockerfile, text.replace(`ARG MEDIAWIKI_VERSION=${cur}`, `ARG MEDIAWIKI_VERSION=${latest}`));
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Security fixes in [${latest}](${dir}) since ${cur}:`,
              '',
              ...security.map((line) => line.replace(/^\* /, '- ')),
              '',
              `Opened by [run ${context.runId}](${run}).`,
              '',
              '```wikitext',
              '===보안 패치===',
              '',
              `*MediaWiki ${cur} → ${latest}`,
              '```',
            ].join('\n');
            fs.writeFileSync(process.env.BODY, body + '\n');
            core.info(body);
            core.setOutput('ver', latest);

      - name: Update README
        if: steps.check.outputs.ver != ''
        uses: ./.github/actions/add-changelog-entry
        with:
          image: mediawiki
          message: Bump MediaWiki to v${{ steps.check.outputs.ver }}

      - uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668 # v5.1.1
        if: ${{ steps.check.outputs.ver != '' && github.repository_owner == 'femiwiki' && github.ref == 'refs/heads/main' }}
        id: get_workflow_token
        with:
          application_id: ${{ vars.PAT_APPLICATION_ID }}
          application_private_key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}

      - name: Create Pull Request
        if: steps.check.outputs.ver != ''
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.get_workflow_token.outputs.token }}
          commit-message: 'build(mediawiki): bump MediaWiki to v${{ steps.check.outputs.ver }}'
          title: 'build(mediawiki): bump MediaWiki to v${{ steps.check.outputs.ver }}'
          branch: bump-mediawiki-security
          body-path: ${{ runner.temp }}/body.md

      - name: Enable Pull Request Automerge
        if: steps.create-pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: gh pr merge --squash --auto "$PR_NUMBER"

  wmf-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Move the extensions and skins that gained security fixes
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BODY: ${{ runner.temp }}/body.md
        with:
          script: |
            const fs = require('fs');
            const json = 'dockers/femiwiki-extensions/extension-installer/extensions.json';
            const config = JSON.parse(fs.readFileSync(json, 'utf8'));
            const branch = config['WMF-branch'];
            const moved = [];
            const notes = [];

            for (const [type, key] of [['extension', 'WMF-extensions'], ['skin', 'WMF-skins']]) {
              for (const [name, old] of Object.entries(config[key])) {
                const repo = `mediawiki-${type}s-${name}`;
                let data;
                try {
                  ({ data } = await github.rest.repos.compareCommits({ owner: 'wikimedia', repo, base: old, head: branch }));
                } catch (error) {
                  core.warning(`could not compare ${name} ${old.slice(0, 7)}...${branch}: ${error.message}`);
                  continue;
                }
                const security = data.commits
                  .map((c) => c.commit.message.split('\n')[0])
                  .filter((subject) => subject.startsWith('SECURITY:'));
                if (security.length === 0) {
                  continue;
                }
                const head = data.commits.at(-1).sha;
                config[key][name] = head;
                moved.push(
                  `- [${name}](https://github.com/wikimedia/${repo}/compare/${old.slice(0, 7)}...${head.slice(0, 7)})`,
                  ...security.map((subject) => `  - ${subject}`),
                );
                notes.push(`*${name} ${old.slice(0, 7)} → ${head.slice(0, 7)}`);
              }
            }

            const count = moved.filter((line) => line.startsWith('- ')).length;
            if (count === 0) {
              core.info(`No security fixes on ${branch}`);
              return;
            }
            fs.writeFileSync(json, JSON.stringify(config, null, 2) + '\n');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Moves ${count} WMF extensions and skins with security fixes to the heads of \`${branch}\`:`,
              '',
              ...moved,
              '',
              `Opened by [run ${context.runId}](${run}).`,
              '',
              '```wikitext',
              '===보안 패치===',
              '',
              ...notes,
              '```',
            ].join('\n');
            fs.writeFileSync(process.env.BODY, body + '\n');
            core.info(body);
            core.setOutput('count', count);
            core.setOutput('branch', branch);

      - name: Update README
        if: steps.check.outputs.count != ''
        uses: ./.github/actions/add-changelog-entry
        with:
          image: femiwiki-extensions
          message: Move ${{ steps.check.outputs.count }} WMF extensions and skins with security fixes to the heads of `${{ steps.check.outputs.branch }}`

      - uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668 # v5.1.1
        if: ${{ steps.check.outputs.count != '' && github.repository_owner == 'femiwiki' && github.ref == 'refs/heads/main' }}
        id: get_workflow_token
        with:
          application_id: ${{ vars.PAT_APPLICATION_ID }}
          application_private_key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}

      - name: Create Pull Request
        if: steps.check.outputs.count != ''
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.get_workflow_token.outputs.token }}
          commit-message: 'build(femiwiki-extensions): move the WMF extensions with security fixes to the heads of ${{ steps.check.outputs.branch }}'
          title: 'build(femiwiki-extensions): move the WMF extensions with security fixes to the heads of ${{ steps.check.outputs.branch }}'
          branch: bump-wmf-security
          body-path: ${{ runner.temp }}/body.md

      - name: Enable Pull Request Automerge
        if: steps.create-pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: gh pr merge --squash --auto "$PR_NUMBER"
