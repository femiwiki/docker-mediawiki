name: 'Docker: php-fpm'

on:
  push:
    branches: [main]
    paths:
      - 'dockers/php-fpm/**'
  workflow_call:
    secrets:
      PAT_APPLICATION_PRIVATE_KEY:
        description: Opens the downstream bump pull request; only used from main
        required: false
  workflow_dispatch:

permissions: {}

jobs:
  get-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ver: ${{ steps.version.outputs.ver }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: version
        run: echo "ver=$(grep -m 1 '## v' dockers/php-fpm/README.md | cut -d'v' -f2)" >> "$GITHUB_OUTPUT"

  build:
    needs: get-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to ghcr.io
        if: github.repository_owner == 'femiwiki' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: '{{ defaultContext }}:dockers/php-fpm'
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=php-fpm-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-fpm-${{ matrix.arch }}
          outputs: ${{ (github.repository_owner == 'femiwiki' && github.ref == 'refs/heads/main') && 'type=image,name=ghcr.io/femiwiki/php-fpm,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}
      - name: Export digest
        if: github.repository_owner == 'femiwiki' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: github.repository_owner == 'femiwiki' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-php-fpm-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push-manifest:
    needs: [get-version, build]
    if: github.repository_owner == 'femiwiki' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-php-fpm-*
          merge-multiple: true
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          VER: ${{ needs.get-version.outputs.ver }}
        run: |
          image=ghcr.io/femiwiki/php-fpm
          args=()
          for digest in *; do
            args+=("${image}@sha256:${digest}")
          done
          docker buildx imagetools create \
            -t "${image}:latest" \
            -t "${image}:${VER}" \
            "${args[@]}"
      - uses: ./.github/actions/add-nev-version-entry-to-changelog
        with:
          version: ${{ needs.get-version.outputs.ver }}
          upstream: php-fpm
          downstream: mediawiki
      - uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668 # v5.1.1
        id: get_workflow_token
        with:
          application_id: ${{ vars.PAT_APPLICATION_ID }}
          application_private_key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}
      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.get_workflow_token.outputs.token }}
          commit-message: 'build(mediawiki): bump php-fpm image to v${{ needs.get-version.outputs.ver }}'
          title: 'build(mediawiki): bump php-fpm image to v${{ needs.get-version.outputs.ver }}'
          branch: bump-php-fpm-v${{ needs.get-version.outputs.ver }}-femiwiki
          body-path: ${{ runner.temp }}/body.md
      - name: Enable Pull Request Automerge
        if: steps.create-pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: gh pr merge --squash --auto "$PR_NUMBER"
