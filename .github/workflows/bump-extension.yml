name: Submit a PR for bumping extension

on:
  repository_dispatch:
    types: [bump-extension]

  workflow_dispatch:
    inputs:
      ext:
        description: The name of extension or skin
        type: string

      ver:
        description: The version released, or for an entry under in-house the full commit hash
        type: string

jobs:
  bump-extension:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the bump and collect the upstream changes for the pull request body
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: vars
        env:
          CLIENT_PAYLOAD_EXTENSION: ${{ github.event.client_payload.extension }}
          CLIENT_PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          CLIENT_PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_EXT: ${{ github.event.inputs.ext }}
          INPUT_VER: ${{ github.event.inputs.ver }}
          BODY: ${{ runner.temp }}/body.md
        with:
          script: |
            const fs = require('fs');
            const env = process.env;
            const ext = env.CLIENT_PAYLOAD_EXTENSION || env.INPUT_EXT;
            const ver = env.CLIENT_PAYLOAD_SHA || env.CLIENT_PAYLOAD_VERSION || env.INPUT_VER;
            const json = JSON.parse(fs.readFileSync('dockers/femiwiki-extensions/extension-installer/extensions.json', 'utf8'));

            let section, field, repo, old, now, message;
            if (Object.hasOwn(json['in-house'], ext)) {
              if (!/^[0-9a-f]{40}$/.test(ver)) {
                core.setFailed(`${ext} is pinned by commit, so it takes a full commit hash, not ${ver}`);
                return;
              }
              section = 'in-house';
              field = 'commit';
              repo = json['in-house'][ext].repository.replace(/^https:\/\/github\.com\//, '');
              old = json['in-house'][ext].commit.slice(0, 7);
              now = ver.slice(0, 7);
              message = `Bump ${ext} to [${now}](https://github.com/${repo}/commit/${ver})`;
            } else if (Object.hasOwn(json['non-WMF'], ext)) {
              section = 'non-WMF';
              field = 'version';
              old = json['non-WMF'][ext].version;
              repo = json['non-WMF'][ext].template.match(/github\.com\/([^/]+\/[^/]+)/)?.[1];
              if (!repo) {
                core.setFailed(`the template of ${ext} is not on GitHub, so there is nothing to compare`);
                return;
              }
              now = ver;
              message = `Bump ${ext} to ${ver}`;
            } else {
              core.setFailed(`no extension named ${ext} under in-house or non-WMF in extensions.json`);
              return;
            }

            // The release notes if the new version has a release, else the commit subjects
            const [owner, name] = repo.split('/');
            let notes = '';
            try {
              notes = (await github.rest.repos.getReleaseByTag({ owner, repo: name, tag: ver })).data.body ?? '';
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!notes) {
              const { data } = await github.rest.repos.compareCommitsWithBasehead({ owner, repo: name, basehead: `${old}...${now}` });
              notes = data.commits
                .map(c => `- ${c.commit.message.split('\n')[0]}`)
                .filter(line => !/^- (Localisation updates|build:)/.test(line))
                .join('\n');
            }
            // Notes of another organisation go in a code fence so their links create no back-references
            const fence = owner === 'femiwiki' ? '' : '````';
            // Outside the fence a bare #N would link to this repository, so qualify it
            if (!fence) notes = notes.replace(/(^|[^\w/[])#(\d+)\b/g, `$1${repo}#$2`);
            const body = `[${old} → ${now}](https://github.com/${repo}/compare/${old}...${now})\n\n${fence}\n${notes}\n${fence}\n`;
            fs.writeFileSync(env.BODY, body);
            core.info(body);

            core.setOutput('ext', ext);
            core.setOutput('ver', ver);
            core.setOutput('repo', repo);
            core.setOutput('old', old);
            core.setOutput('new', now);
            core.setOutput('section', section);
            core.setOutput('field', field);
            core.setOutput('message', message);

      - uses: ./.github/actions/release-title
        id: title
        with:
          repo: ${{ steps.vars.outputs.repo }}
          old: ${{ steps.vars.outputs.old }}
          ver: ${{ steps.vars.outputs.new }}
          scope: femiwiki-extensions
          name: ${{ steps.vars.outputs.ext }}
          body: ${{ runner.temp }}/body.md

      - name: Update extensions.json
        env:
          EXT: ${{ steps.vars.outputs.ext }}
          VER: ${{ steps.vars.outputs.ver }}
          SECTION: ${{ steps.vars.outputs.section }}
          FIELD: ${{ steps.vars.outputs.field }}
        run: |
          json=dockers/femiwiki-extensions/extension-installer/extensions.json
          jq -e --arg ext "$EXT" --arg section "$SECTION" '.[$section] | has($ext)' "$json" > /dev/null \
            || { echo "::error::no extension named $EXT under $SECTION in extensions.json"; exit 1; }
          jq --arg ext "$EXT" --arg ver "$VER" --arg section "$SECTION" --arg field "$FIELD" \
            '.[$section][$ext][$field] = $ver' "$json" > "${RUNNER_TEMP}/extensions.json"
          mv "${RUNNER_TEMP}/extensions.json" "$json"

      - name: Update README
        uses: ./.github/actions/add-changelog-entry
        with:
          image: femiwiki-extensions
          level: ${{ steps.title.outputs.level }}
          message: ${{ steps.vars.outputs.message }}

      - uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668 # v5.1.1
        if: ${{ github.repository_owner == 'femiwiki' && github.ref == 'refs/heads/main' }}
        id: get_workflow_token
        with:
          application_id: ${{ vars.PAT_APPLICATION_ID }}
          application_private_key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.get_workflow_token.outputs.token }}
          commit-message: ${{ steps.title.outputs.title }}
          title: ${{ steps.title.outputs.title }}
          branch: bump-${{steps.vars.outputs.ext}}
          body-path: ${{ runner.temp }}/body.md

      - name: Enable Pull Request Automerge
        if: steps.create-pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: gh pr merge --squash --auto "$PR_NUMBER"
