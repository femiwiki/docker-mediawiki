name: Submit a PR for bumping extension

on:
  repository_dispatch:
    types: [bump-extension]

  workflow_dispatch:
    inputs:
      ext:
        description: The name of extension or skin
        type: string

      ver:
        description: The version released, or for an entry under in-house the full commit hash
        type: string

jobs:
  bump-extension:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: vars
        env:
          CLIENT_PAYLOAD_EXTENSION: ${{ github.event.client_payload.extension }}
          CLIENT_PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          CLIENT_PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_EXT: ${{ github.event.inputs.ext }}
          INPUT_VER: ${{ github.event.inputs.ver }}
        with:
          script: |
            return {
              ext: process.env.CLIENT_PAYLOAD_EXTENSION || process.env.INPUT_EXT,
              ver: process.env.CLIENT_PAYLOAD_SHA || process.env.CLIENT_PAYLOAD_VERSION || process.env.INPUT_VER,
            }

      - name: Collect the upstream changes for the pull request body
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          EXT: ${{ fromJSON(steps.vars.outputs.result).ext }}
          VER: ${{ fromJSON(steps.vars.outputs.result).ver }}
          BODY: ${{ runner.temp }}/body.md
        run: |
          json=dockers/femiwiki-extensions/extension-installer/extensions.json
          if jq -e --arg ext "$EXT" '.["in-house"] | has($ext)' "$json" > /dev/null; then
            [[ "$VER" =~ ^[0-9a-f]{40}$ ]] \
              || { echo "::error::$EXT is pinned by commit, so it takes a full commit hash, not $VER"; exit 1; }
            section=in-house
            field=commit
            repo=$(jq -r --arg ext "$EXT" '.["in-house"][$ext].repository' "$json" | sed 's#^https://github.com/##')
            full_old=$(jq -r --arg ext "$EXT" '.["in-house"][$ext].commit' "$json")
            old=${full_old:0:7}
            new=${VER:0:7}
            message="Bump $EXT to [$new](https://github.com/$repo/commit/$VER)"
          else
            section=non-WMF
            field=version
            old=$(jq -r --arg ext "$EXT" '.["non-WMF"][$ext].version' "$json")
            repo=$(jq -r --arg ext "$EXT" '.["non-WMF"][$ext].template' "$json" | grep -oE 'github\.com/[^/]+/[^/]+' | cut -d/ -f2-)
            new=$VER
            message="Bump $EXT to $VER"
          fi
          # Notes of another organisation go in a code fence so their links create no back-references
          fence=''
          [ "${repo%%/*}" = femiwiki ] || fence='````'
          {
            echo "[$old → $new](https://github.com/$repo/compare/$old...$new)"
            echo
            echo "$fence"
            if notes=$(gh release view "$VER" --repo "$repo" --json body --jq .body) && [ -n "$notes" ]; then
              echo "$notes"
            else
              gh api "repos/$repo/compare/$old...$new" --jq '.commits[] | "- " + (.commit.message | split("\n")[0])' \
                | { grep -vE '^- (Localisation updates|build:)' || true; }
            fi
            echo "$fence"
          } > "$BODY"
          cat "$BODY"
          {
            echo "repo=$repo"
            echo "old=$old"
            echo "new=$new"
            echo "section=$section"
            echo "field=$field"
            echo "message=$message"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/release-title
        id: title
        with:
          repo: ${{ steps.upstream.outputs.repo }}
          old: ${{ steps.upstream.outputs.old }}
          ver: ${{ steps.upstream.outputs.new }}
          scope: femiwiki-extensions
          name: ${{ fromJSON(steps.vars.outputs.result).ext }}
          body: ${{ runner.temp }}/body.md

      - name: Update extensions.json
        env:
          EXT: ${{ fromJSON(steps.vars.outputs.result).ext }}
          VER: ${{ fromJSON(steps.vars.outputs.result).ver }}
          SECTION: ${{ steps.upstream.outputs.section }}
          FIELD: ${{ steps.upstream.outputs.field }}
        run: |
          json=dockers/femiwiki-extensions/extension-installer/extensions.json
          jq -e --arg ext "$EXT" --arg section "$SECTION" '.[$section] | has($ext)' "$json" > /dev/null \
            || { echo "::error::no extension named $EXT under $SECTION in extensions.json"; exit 1; }
          jq --arg ext "$EXT" --arg ver "$VER" --arg section "$SECTION" --arg field "$FIELD" \
            '.[$section][$ext][$field] = $ver' "$json" > "${RUNNER_TEMP}/extensions.json"
          mv "${RUNNER_TEMP}/extensions.json" "$json"

      - name: Update README
        uses: ./.github/actions/add-changelog-entry
        with:
          image: femiwiki-extensions
          level: ${{ steps.title.outputs.level }}
          message: ${{ steps.upstream.outputs.message }}

      - uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668 # v5.1.1
        if: ${{ github.repository_owner == 'femiwiki' && github.ref == 'refs/heads/main' }}
        id: get_workflow_token
        with:
          application_id: ${{ vars.PAT_APPLICATION_ID }}
          application_private_key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.get_workflow_token.outputs.token }}
          commit-message: ${{ steps.title.outputs.title }}
          title: ${{ steps.title.outputs.title }}
          branch: bump-${{fromJSON(steps.vars.outputs.result).ext}}
          body-path: ${{ runner.temp }}/body.md

      - name: Enable Pull Request Automerge
        if: steps.create-pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: gh pr merge --squash --auto "$PR_NUMBER"
