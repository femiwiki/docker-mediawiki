name: Required

on:
  push:
    branches: [main]
  pull_request:

# A new commit on a pull request makes the run on its old commit pointless,
# so that run is cancelled. Each run on main gets a group of its own and is
# never cancelled. Branch protection reads only the newest commit's checks.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ case(github.event_name == 'pull_request',
    github.event.pull_request.number, github.run_id) }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      checks: write

  # Only for pull requests: on main images.yml runs by itself and publishes.
  # The permissions are the union images.yml and the image workflows declare.
  images:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/images.yml
    permissions:
      contents: write
      packages: write
      pull-requests: write
    secrets:
      PAT_APPLICATION_PRIVATE_KEY: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}

  long-comments:
    uses: femiwiki/.github/.github/workflows/long-comments.yml@3045636f57bbbb8c69ef77d296bc66055fd03aff
    permissions:
      contents: read

  shared-lint:
    uses: femiwiki/.github/.github/workflows/shared-lint.yml@3045636f57bbbb8c69ef77d296bc66055fd03aff
    permissions:
      contents: read

  required-gate:
    uses: femiwiki/.github/.github/workflows/required-gate.yml@3045636f57bbbb8c69ef77d296bc66055fd03aff
    permissions:
      contents: read

  # The one check branch protection requires. What has to pass is the
  # workflows called above, so adding a check does not touch femiwiki/infra.
  required:
    needs: [lint, images, long-comments, shared-lint, required-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every workflow above passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
