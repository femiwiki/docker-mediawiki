# The image test deploys this over compose.yaml. Debug mode turns $wgUseCdn
# off, which makes every response private, so Caddy's cache would never store
# one; the test needs the cacheable responses production serves.
services:
  fastcgi:
    environment:
      MEDIAWIKI_HOTFIX_SNIPPET: '<?php $$wgUseCdn = true; $$wgCdnServers = [];'
      # Production profiles slow requests; every request here, so a file is written
      FW_PROFILER: excimer
      FW_PROFILER_SAMPLING: '1'
      FW_PROFILER_THRESHOLD: '0.001'
      FW_PROFILER_PERIOD: '0.001'
