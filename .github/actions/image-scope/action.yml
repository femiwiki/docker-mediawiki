name: image-scope
description: List the images a pull request changes
inputs:
  images:
    description: The image directory names under dockers/, space separated
    required: true
outputs:
  changed:
    description: A JSON array of the images that must be built
    value: ${{ steps.scope.outputs.changed }}
runs:
  using: composite
  steps:
    - id: scope
      env:
        GH_TOKEN: ${{ github.token }}
        IMAGES: ${{ inputs.images }}
        PR: ${{ github.event.number }}
      shell: bash
      run: |
        files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
        touched() {
          while IFS= read -r file; do
            case "$file" in
              "dockers/$1/"* | ".github/workflows/docker-$1.yml") return 0 ;;
            esac
          done <<< "$files"
          return 1
        }
        changed=$(
          for image in $IMAGES; do
            if touched "$image"; then echo "$image"; fi
          done | jq -Rsc 'split("\n") | map(select(length > 0))'
        )
        echo "Images to build: $changed"
        echo "changed=$changed" >> "$GITHUB_OUTPUT"
