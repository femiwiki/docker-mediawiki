name: image-scope
description: List the images a pull request, a push to main or a dispatch builds
inputs:
  images:
    description: The image directory names under dockers/, space separated
    required: true
  contexts:
    description: >
      Files outside an image's directory that its build reads, as image=path
      pairs, space separated
    required: false
    default: ''
  tests:
    description: >
      Files outside an image's directory that only its pull request test reads,
      as image=path pairs, space separated; they build the image on a pull
      request but publish nothing
    required: false
    default: ''
  dispatched:
    description: The image a workflow_dispatch asked for
    required: false
    default: ''
outputs:
  changed:
    description: A JSON array of the images that must be built
    value: ${{ steps.scope.outputs.changed }}
runs:
  using: composite
  steps:
    - id: scope
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        IMAGES: ${{ inputs.images }}
        CONTEXTS: ${{ inputs.contexts }}
        TESTS: ${{ inputs.tests }}
        DISPATCHED: ${{ inputs.dispatched }}
      with:
        script: |
          const fs = require('fs');
          const images = process.env.IMAGES.split(/\s+/).filter(Boolean);
          const pairs = value => value.split(/\s+/).filter(Boolean).map(pair => pair.split('='));
          const contexts = pairs(process.env.CONTEXTS);
          const tests = pairs(process.env.TESTS);
          // An image's own files and what its build reads; its README is only
          // read by people, so editing it publishes nothing
          const builds = (image, file) => (file.startsWith(`dockers/${image}/`) && file !== `dockers/${image}/README.md`)
            || contexts.some(([name, path]) => name === image && file.startsWith(path));
          let changed;
          if (context.eventName === 'workflow_dispatch') {
            changed = images.filter(image => image === process.env.DISPATCHED);
          } else if (context.eventName === 'push') {
            // Only an image's own files publish it: a workflow edit on main builds nothing
            const { data } = await github.rest.repos.compareCommitsWithBasehead(
              { ...context.repo, basehead: `${context.payload.before}...${context.payload.after}` });
            const files = data.files.map(file => file.filename);
            changed = images.filter(image => files.some(file => builds(image, file)));
          } else {
            const files = await github.paginate(github.rest.pulls.listFiles,
              { ...context.repo, pull_number: context.issue.number, per_page: 100 },
              response => response.data.map(file => file.filename));
            // The workflow that builds an image: its own, else the shared one
            const workflow = image => fs.existsSync(`.github/workflows/docker-${image}.yml`)
              ? `.github/workflows/docker-${image}.yml` : '.github/workflows/docker-image.yml';
            const tested = (image, file) => file === workflow(image)
              || tests.some(([name, path]) => name === image && file.startsWith(path));
            changed = images.filter(image => files.some(file =>
              builds(image, file) || tested(image, file)));
          }
          core.info(`Images to build: ${JSON.stringify(changed)}`);
          core.setOutput('changed', JSON.stringify(changed));
