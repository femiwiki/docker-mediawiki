name: image-scope
description: List the images a pull request changes
inputs:
  images:
    description: The image directory names under dockers/, space separated
    required: true
outputs:
  changed:
    description: A JSON array of the images that must be built
    value: ${{ steps.scope.outputs.changed }}
runs:
  using: composite
  steps:
    - id: scope
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        IMAGES: ${{ inputs.images }}
      with:
        script: |
          const files = await github.paginate(github.rest.pulls.listFiles,
            { ...context.repo, pull_number: context.issue.number, per_page: 100 },
            response => response.data.map(file => file.filename));
          const changed = process.env.IMAGES.split(/\s+/).filter(image => image && files.some(file =>
            file.startsWith(`dockers/${image}/`) || file === `.github/workflows/docker-${image}.yml`));
          core.info(`Images to build: ${JSON.stringify(changed)}`);
          core.setOutput('changed', JSON.stringify(changed));
