name: docker-caddy
inputs:
  version:
    required: true
    default: false
  upstream:
    required: true
    default: false
  downstream:
    required: false
    default: false
runs:
  using: composite
  steps:
    - env:
        INPUTS_UPSTREAM: ${{ inputs.upstream }}
        INPUTS_VERSION: ${{ inputs.version }}
        INPUTS_DOWNSTREAM: ${{ inputs.downstream }}
      shell: bash
      run: |
        OLD_VER=$(grep -oE "ghcr\.io/femiwiki/${INPUTS_UPSTREAM}:[0-9.]+" dockers/${INPUTS_DOWNSTREAM}/Dockerfile | head -n 1 | cut -d: -f2)

        # The pull request body: the upstream README entries after the version the downstream uses
        {
          echo "[dockers/${INPUTS_UPSTREAM}/README.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/dockers/${INPUTS_UPSTREAM}/README.md) v${OLD_VER} → v${INPUTS_VERSION}"
          echo
          awk -v new="## v${INPUTS_VERSION}" -v old="## v${OLD_VER}" '$0 == new { on = 1 } $0 == old { exit } on' dockers/${INPUTS_UPSTREAM}/README.md
        } > "${RUNNER_TEMP}/body.md"

        # Update Dockerfile
        sed -i "s/$OLD_VER/${INPUTS_VERSION}/" dockers/${INPUTS_DOWNSTREAM}/Dockerfile
        if [ ! -z "$(git status --porcelain)" ]; then
          # Add an entry to README.md
          head -n 2 dockers/${INPUTS_DOWNSTREAM}/README.md > temp.md
          grep -m 1 '## v' dockers/${INPUTS_DOWNSTREAM}/README.md | cut -d. -f1-2 | tr -d '\n' >> temp.md
          echo -n . >> temp.md
          grep -m 1 '## v' dockers/${INPUTS_DOWNSTREAM}/README.md | cut -d. -f3 | awk '{print $1 + 1}' >> temp.md
          echo >> temp.md
          echo "- Bump femiwiki/${INPUTS_UPSTREAM} to v${INPUTS_VERSION}" >> temp.md
          echo >> temp.md
          tail -n +3 dockers/${INPUTS_DOWNSTREAM}/README.md >> temp.md
          mv -f temp.md dockers/${INPUTS_DOWNSTREAM}/README.md
        fi
