name: image-gate
description: Report whether a pull request left an image sound
inputs:
  image:
    description: The image's directory name under dockers/
    required: true
  scope:
    description: The result of the scope job
    required: true
  changed:
    description: The scope job's build output
    required: true
  jobs:
    description: The jobs that had to succeed, as name=result pairs
    required: true
runs:
  using: composite
  steps:
    - env:
        IMAGE: ${{ inputs.image }}
        SCOPE: ${{ inputs.scope }}
        CHANGED: ${{ inputs.changed }}
        JOBS: ${{ inputs.jobs }}
      shell: bash
      run: |
        if [ "$SCOPE" != success ]; then
          echo "::error::could not tell whether this pull request changes the $IMAGE image"
          exit 1
        fi
        if [ "$CHANGED" != true ]; then
          echo "This pull request does not change the $IMAGE image."
          exit 0
        fi
        for job in $JOBS; do
          if [ "${job#*=}" != success ]; then
            echo "::error::the $IMAGE image failed at ${job%%=*}: ${job#*=}"
            exit 1
          fi
        done
        echo "The $IMAGE image is sound."
